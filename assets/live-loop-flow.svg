<svg width="1020" height="230" viewBox="0 0 1020 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Master Dark Surface Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12151c" />
      <stop offset="100%" stop-color="#0c0e13" />
    </linearGradient>

    <!-- Subdued Single Master Cobalt Accent -->
    <linearGradient id="cobaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#005bb5" />
    </linearGradient>

    <!-- Subtle Hairline Shading -->
    <linearGradient id="hairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.14)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.06)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.12)" />
    </linearGradient>

    <!-- Subtle Elevation Shadow (No Neon Halos) -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Connection Markers -->
    <marker id="arrowHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b4252" />
    </marker>
    <marker id="loopHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0071e3" />
    </marker>
  </defs>

  <style>
    .step-badge { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #0071e3; letter-spacing: 0.08em; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; letter-spacing: -0.01em; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #94a3b8; line-height: 1.4; }
    .code-tag { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 600; fill: #e2e8f0; }
    .kbd-tag { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #ffffff; }
    .loop-label { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 600; fill: #64748b; letter-spacing: 0.06em; }
  </style>

  <!-- Connectors -->
  <line x1="230" y1="80" x2="260" y2="80" stroke="#2a3241" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowHead)" />
  <line x1="480" y1="80" x2="510" y2="80" stroke="#2a3241" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowHead)" />
  <line x1="730" y1="80" x2="760" y2="80" stroke="#2a3241" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowHead)" />

  <!-- Continuous Loopback Return Trace -->
  <path d="M 875 145 C 875 200, 125 200, 125 145" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#loopHead)" />
  <rect x="410" y="186" width="180" height="22" rx="4" fill="#0c0e13" stroke="#1e293b" stroke-width="1" />
  <text x="500" y="201" text-anchor="middle" class="loop-label">⚡ CONTINUOUS LIVE LOOP</text>

  <!-- Card 1: Browser Preview -->
  <g transform="translate(15, 12)" filter="url(#cardShadow)">
    <rect width="220" height="134" rx="10" fill="url(#cardBg)" stroke="url(#hairline)" stroke-width="1" />
    <rect x="1" y="1" width="218" height="2" fill="#0071e3" rx="1" />
    
    <text x="14" y="24" class="step-badge">01 · BROWSER</text>
    <text x="14" y="44" class="card-title">In-Browser Capture</text>
    
    <text x="14" y="68" class="card-body">• Press <tspan class="code-tag">S</tspan> to marquee crop</text>
    <text x="14" y="86" class="card-body">• Or click any DOM element</text>

    <rect x="14" y="98" width="192" height="24" rx="5" fill="rgba(0, 113, 227, 0.12)" stroke="rgba(0, 113, 227, 0.3)" />
    <text x="110" y="114" text-anchor="middle" class="kbd-tag">Hit [ Ctrl + Enter ] ⚡</text>
  </g>

  <!-- Card 2: React Fiber Resolver -->
  <g transform="translate(265, 12)" filter="url(#cardShadow)">
    <rect width="220" height="134" rx="10" fill="url(#cardBg)" stroke="url(#hairline)" stroke-width="1" />
    
    <text x="14" y="24" class="step-badge" style="fill: #94a3b8;">02 · RESOLVE</text>
    <text x="14" y="44" class="card-title">Fiber Source Anchor</text>
    
    <text x="14" y="68" class="card-body">• Traverses React Fiber</text>
    <text x="14" y="86" class="card-body">• Maps <tspan class="code-tag">&lt;Hero /&gt; #L42</tspan></text>

    <rect x="14" y="98" width="192" height="24" rx="5" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="110" y="114" text-anchor="middle" class="code-tag" style="font-size: 9.5px; fill: #94a3b8;">.visualpatch/inbox.md</text>
  </g>

  <!-- Card 3: AI Agent Auto-Wake -->
  <g transform="translate(515, 12)" filter="url(#cardShadow)">
    <rect width="220" height="134" rx="10" fill="url(#cardBg)" stroke="url(#hairline)" stroke-width="1" />
    
    <text x="14" y="24" class="step-badge" style="fill: #94a3b8;">03 · AGENT</text>
    <text x="14" y="44" class="card-title">Reactive Agent Wake</text>
    
    <text x="14" y="68" class="card-body">• Ingests task queue</text>
    <text x="14" y="86" class="card-body">• Zero exploratory turns</text>

    <rect x="14" y="98" width="192" height="24" rx="5" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="110" y="114" text-anchor="middle" class="code-tag" style="font-size: 9.5px; fill: #cbd5e1;">Surgical Code Diff (0 Token Base64)</text>
  </g>

  <!-- Card 4: Vite HMR Live Update -->
  <g transform="translate(765, 12)" filter="url(#cardShadow)">
    <rect width="220" height="134" rx="10" fill="url(#cardBg)" stroke="url(#hairline)" stroke-width="1" />
    
    <text x="14" y="24" class="step-badge" style="fill: #94a3b8;">04 · SYNC</text>
    <text x="14" y="44" class="card-title">Vite HMR ~50ms</text>
    
    <text x="14" y="68" class="card-body">• Instant hot reload</text>
    <text x="14" y="86" class="card-body">• Zero window switching</text>

    <rect x="14" y="98" width="192" height="24" rx="5" fill="rgba(0, 113, 227, 0.12)" stroke="rgba(0, 113, 227, 0.3)" />
    <text x="110" y="114" text-anchor="middle" class="kbd-tag">Live UI Morphed ✨</text>
  </g>
</svg>