<svg width="1020" height="220" viewBox="0 0 1020 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Master Dark Surface Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131720" />
      <stop offset="100%" stop-color="#0b0d12" />
    </linearGradient>

    <!-- Subtle Hairline Shading -->
    <linearGradient id="hairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.16)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.05)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.12)" />
    </linearGradient>

    <!-- Subtle Elevation Shadow (Zero Neon Glare) -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <!-- Markers -->
    <marker id="arrowHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b4252" />
    </marker>
    <marker id="loopHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0071e3" />
    </marker>
  </defs>

  <style>
    .step-badge { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #0071e3; letter-spacing: 0.08em; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #f8fafc; letter-spacing: -0.01em; }
    .card-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; fill: #94a3b8; line-height: 1.4; }
    .code-tag { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 600; fill: #e2e8f0; }
    .kbd-tag { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #ffffff; }
    .loop-label { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #64748b; letter-spacing: 0.08em; }
  </style>

  <!-- Connectors -->
  <line x1="235" y1="78" x2="260" y2="78" stroke="#2a3241" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowHead)" />
  <line x1="485" y1="78" x2="510" y2="78" stroke="#2a3241" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowHead)" />
  <line x1="735" y1="78" x2="760" y2="78" stroke="#2a3241" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowHead)" />

  <!-- Continuous Loopback Return Trace -->
  <path d="M 875 142 C 875 194, 125 194, 125 142" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#loopHead)" />
  <rect x="400" y="178" width="200" height="22" rx="4" fill="#0b0d12" stroke="#1e293b" stroke-width="1" />
  <text x="500" y="193" text-anchor="middle" class="loop-label">⚡ ZERO WINDOW SWITCHING LOOP</text>

  <!-- Card 1: Browser Preview -->
  <g transform="translate(15, 12)" filter="url(#cardShadow)">
    <rect width="220" height="130" rx="10" fill="url(#cardBg)" stroke="url(#hairline)" stroke-width="1" />
    <rect x="1" y="1" width="218" height="2" fill="#0071e3" rx="1" />
    
    <!-- Vector Globe/Pin Icon -->
    <g transform="translate(14, 15)">
      <circle cx="6" cy="6" r="6" stroke="#0071e3" stroke-width="1.2" fill="none" />
      <line x1="0" y1="6" x2="12" y2="6" stroke="#0071e3" stroke-width="1" />
      <path d="M6 0 C8 3, 8 9, 6 12 C4 9, 4 3, 6 0" stroke="#0071e3" stroke-width="1" fill="none" />
    </g>
    <text x="32" y="24" class="step-badge">01 · BROWSER</text>
    <text x="14" y="44" class="card-title">In-Browser Capture</text>
    
    <text x="14" y="66" class="card-body">• Press <tspan class="code-tag">S</tspan> to marquee crop</text>
    <text x="14" y="84" class="card-body">• Or click any DOM element</text>

    <rect x="14" y="96" width="192" height="22" rx="4" fill="rgba(0, 113, 227, 0.14)" stroke="rgba(0, 113, 227, 0.35)" />
    <text x="110" y="111" text-anchor="middle" class="kbd-tag">Hit [ Ctrl + Enter ] ⚡</text>
  </g>

  <!-- Card 2: React Fiber Resolver -->
  <g transform="translate(265, 12)" filter="url(#cardShadow)">
    <rect width="220" height="130" rx="10" fill="url(#cardBg)" stroke="url(#hairline)" stroke-width="1" />
    
    <!-- Vector Code Brackets Icon -->
    <g transform="translate(14, 15)">
      <path d="M4 2 L0 6 L4 10" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" fill="none" />
      <path d="M8 2 L12 6 L8 10" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" fill="none" />
    </g>
    <text x="32" y="24" class="step-badge" style="fill: #94a3b8;">02 · RESOLVE</text>
    <text x="14" y="44" class="card-title">Fiber Source Anchor</text>
    
    <text x="14" y="66" class="card-body">• Traverses React Fiber</text>
    <text x="14" y="84" class="card-body">• Maps <tspan class="code-tag">&lt;Hero /&gt; #L42</tspan></text>

    <rect x="14" y="96" width="192" height="22" rx="4" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="110" y="111" text-anchor="middle" class="code-tag" style="font-size: 9.5px; fill: #94a3b8;">.visualpatch/inbox.md</text>
  </g>

  <!-- Card 3: AI Agent Auto-Wake -->
  <g transform="translate(515, 12)" filter="url(#cardShadow)">
    <rect width="220" height="130" rx="10" fill="url(#cardBg)" stroke="url(#hairline)" stroke-width="1" />
    
    <!-- Vector Chip/Agent Icon -->
    <g transform="translate(14, 15)">
      <rect x="2" y="2" width="8" height="8" rx="2" stroke="#94a3b8" stroke-width="1.2" fill="none" />
      <line x1="6" y1="0" x2="6" y2="2" stroke="#94a3b8" stroke-width="1" />
      <line x1="6" y1="10" x2="6" y2="12" stroke="#94a3b8" stroke-width="1" />
      <line x1="0" y1="6" x2="2" y2="6" stroke="#94a3b8" stroke-width="1" />
      <line x1="10" y1="6" x2="12" y2="6" stroke="#94a3b8" stroke-width="1" />
    </g>
    <text x="32" y="24" class="step-badge" style="fill: #94a3b8;">03 · AGENT</text>
    <text x="14" y="44" class="card-title">Reactive Agent Wake</text>
    
    <text x="14" y="66" class="card-body">• Ingests task queue</text>
    <text x="14" y="84" class="card-body">• Zero exploratory turns</text>

    <rect x="14" y="96" width="192" height="22" rx="4" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" />
    <text x="110" y="111" text-anchor="middle" class="code-tag" style="font-size: 9.5px; fill: #cbd5e1;">Surgical Code Diff (0 Tokens)</text>
  </g>

  <!-- Card 4: Vite HMR Live Update -->
  <g transform="translate(765, 12)" filter="url(#cardShadow)">
    <rect width="220" height="130" rx="10" fill="url(#cardBg)" stroke="url(#hairline)" stroke-width="1" />
    
    <!-- Vector Bolt/Sparkle Icon -->
    <g transform="translate(14, 15)">
      <polygon points="7,0 2,7 6,7 5,12 11,5 7,5" fill="#0071e3" />
    </g>
    <text x="32" y="24" class="step-badge" style="fill: #94a3b8;">04 · SYNC</text>
    <text x="14" y="44" class="card-title">Vite HMR ~50ms</text>
    
    <text x="14" y="66" class="card-body">• Instant hot reload</text>
    <text x="14" y="84" class="card-body">• Zero window switching</text>

    <rect x="14" y="96" width="192" height="22" rx="4" fill="rgba(0, 113, 227, 0.14)" stroke="rgba(0, 113, 227, 0.35)" />
    <text x="110" y="111" text-anchor="middle" class="kbd-tag">Live UI Morphed ✨</text>
  </g>
</svg>