<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VisualPatch</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 330px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b0d12;
      color: #f1f5f9;
      -webkit-font-smoothing: antialiased;
    }

    /* 1. Header */
    .vp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 14px;
    }

    .vp-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .vp-logo-badge {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: linear-gradient(135deg, #0071e3 0%, #0284c7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }

    .vp-title {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .vp-ver-tag {
      font-size: 10px;
      font-weight: 600;
      padding: 1.5px 5.5px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.28);
      color: #38bdf8;
      letter-spacing: 0.02em;
    }

    .vp-status-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10.5px;
      font-weight: 600;
      color: #10b981;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.22);
      padding: 2.5px 8px;
      border-radius: 9999px;
      letter-spacing: 0.03em;
    }

    .vp-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
      animation: vp-pulse 2s infinite ease-in-out;
    }

    @keyframes vp-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    /* 2. Action Tiles */
    .vp-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .vp-action-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      text-align: left;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .vp-action-btn:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(56, 189, 248, 0.35);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    }

    .vp-action-btn:active {
      transform: translateY(0);
    }

    .vp-btn-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .vp-icon-circle {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .vp-btn-info {
      display: flex;
      flex-direction: column;
      gap: 1.5px;
    }

    .vp-btn-title {
      font-size: 12.5px;
      font-weight: 600;
      color: #f8fafc;
    }

    .vp-btn-desc {
      font-size: 10.5px;
      color: #94a3b8;
    }

    .vp-kbd-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10.5px;
      font-weight: 600;
      padding: 2.5px 6px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #e2e8f0;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    /* 3. Keyboard Cheat Sheet Card */
    .vp-guide-card {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .vp-guide-header {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      color: #cbd5e1;
      letter-spacing: 0.03em;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .vp-guide-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 10px;
      align-items: center;
    }

    .vp-guide-action {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 4. Footer */
    .vp-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 10.5px;
      color: #64748b;
    }

    .vp-footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s;
    }

    .vp-footer a:hover {
      color: #7dd3fc;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="vp-header">
    <div class="vp-brand">
      <div class="vp-logo-badge">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <path d="m9 12 2 2 4-4" />
        </svg>
      </div>
      <div class="vp-title">
        VisualPatch
        <span class="vp-ver-tag">v2.0</span>
      </div>
    </div>
    <div class="vp-status-pill">
      <span class="vp-status-dot"></span>
      <span>LOCALHOST</span>
    </div>
  </div>

  <!-- Action Tiles -->
  <div class="vp-actions">
    <!-- 1. Area Screenshot -->
    <button class="vp-action-btn" id="toggle-screenshot">
      <div class="vp-btn-left">
        <div class="vp-icon-circle" style="background: rgba(2, 132, 199, 0.18); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
            <circle cx="12" cy="13" r="4" />
          </svg>
        </div>
        <div class="vp-btn-info">
          <span class="vp-btn-title">Area Screenshot</span>
          <span class="vp-btn-desc">Spotlight crop with dimensions</span>
        </div>
      </div>
      <div class="vp-kbd-badge">
        <kbd>S</kbd>
      </div>
    </button>

    <!-- 2. Inspect & Drop Pin -->
    <button class="vp-action-btn" id="toggle-inspect">
      <div class="vp-btn-left">
        <div class="vp-icon-circle" style="background: rgba(0, 113, 227, 0.18); color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.3);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="22" y1="12" x2="18" y2="12" />
            <line x1="6" y1="12" x2="2" y2="12" />
            <line x1="12" y1="6" x2="12" y2="2" />
            <line x1="12" y1="22" x2="12" y2="18" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </div>
        <div class="vp-btn-info">
          <span class="vp-btn-title">Inspect & Drop Pin</span>
          <span class="vp-btn-desc">Hover & click DOM elements</span>
        </div>
      </div>
      <div class="vp-kbd-badge">
        <kbd>Esc</kbd>
      </div>
    </button>

    <!-- 3. Toggle Toolbar Dock -->
    <button class="vp-action-btn" id="toggle-toolbar">
      <div class="vp-btn-left">
        <div class="vp-icon-circle" style="background: rgba(139, 92, 246, 0.16); color: #a78bfa; border: 1px solid rgba(167, 139, 250, 0.3);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </div>
        <div class="vp-btn-info">
          <span class="vp-btn-title">Floating Dock</span>
          <span class="vp-btn-desc">Show or hide on-screen toolbar</span>
        </div>
      </div>
      <div class="vp-kbd-badge">
        <kbd>Alt</kbd>+<kbd>T</kbd>
      </div>
    </button>
  </div>

  <!-- Keyboard Shortcuts Cheat Sheet -->
  <div class="vp-guide-card">
    <div class="vp-guide-header">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <rect width="20" height="16" x="2" y="4" rx="2" />
        <path d="M6 8h.001M10 8h.001M14 8h.001M18 8h.001M8 12h.001M12 12h.001M16 12h.001M7 16h10" />
      </svg>
      <span>Keyboard Cheat Sheet</span>
    </div>
    <div class="vp-guide-grid">
      <div class="vp-kbd-badge"><kbd>S</kbd></div>
      <div class="vp-guide-action">Area Screenshot Spotlight</div>

      <div class="vp-kbd-badge"><kbd>Ctrl</kbd>+<kbd>C</kbd></div>
      <div class="vp-guide-action">Copy for AI (+ image strip)</div>

      <div class="vp-kbd-badge"><kbd>Esc</kbd></div>
      <div class="vp-guide-action">Toggle Inspect / Close Card</div>

      <div class="vp-kbd-badge"><kbd>Alt</kbd>+<kbd>T</kbd></div>
      <div class="vp-guide-action">Minimize / Show Dock</div>

      <div class="vp-kbd-badge"><kbd>Enter</kbd></div>
      <div class="vp-guide-action">Save Note (inside card)</div>
    </div>
  </div>

  <!-- Footer -->
  <div class="vp-footer">
    <span>🔒 100% Local • Zero Telemetry</span>
    <a href="https://github.com/OpusTechnica/VisualPatch" target="_blank" rel="noreferrer">GitHub ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
