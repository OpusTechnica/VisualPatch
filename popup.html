<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Antigravity Annotator</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1115;
      color: #f7f8f8;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #0071e3;
      box-shadow: 0 0 8px #0071e3;
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .status {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: #0071e3;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #005bb5;
    }
    .shortcut {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
    }
    kbd {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 5px;
      border-radius: 3px;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="dot"></div>
    <div class="title">Antigravity Annotator</div>
  </div>
  <div class="status">
    Active on all <code>localhost</code> and <code>127.0.0.1</code> tabs.
  </div>
  <button class="btn" id="toggle-toolbar" style="margin-bottom: 8px;">
    👁️ Toggle Toolbar (Alt + T / F8)
  </button>
  <button class="btn" id="toggle-inspect" style="background: #2563eb;">
    📌 Drop Pin / Inspect (Alt + D / F9)
  </button>
  <div class="shortcut">
    <kbd>Alt</kbd> + <kbd>T</kbd> Toggle Toolbar<br/>
    <kbd>Alt</kbd> + <kbd>D</kbd> Drop Pin Mode
  </div>
  <script src="popup.js"></script>
</body>
</html>
