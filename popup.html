<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VisualPatch</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    :root {
      --bg-base: #0b0d11;
      --bg-card: rgba(18, 21, 28, 0.75);
      --bg-card-hover: rgba(26, 31, 42, 0.9);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(0, 113, 227, 0.4);
      --border-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-blue: #0071e3;
      --accent-green: #10b981;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", -system-ui, sans-serif;
      --font-mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Monaco, Consolas, monospace;
    }

    body {
      width: 320px;
      padding: 14px;
      font-family: var(--font-sans);
      background: var(--bg-base);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
      overflow: hidden;
    }

    /* Ambient Top Hairline Highlight */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      pointer-events: none;
    }

    /* 1. Header (Apple Navigation Capsule) */
    .vp-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .vp-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .vp-icon-wrap {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vp-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .vp-badge {
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 600;
      color: var(--accent-blue);
      background: rgba(0, 113, 227, 0.08);
      border: 1px solid rgba(0, 113, 227, 0.25);
      padding: 1px 4.5px;
      border-radius: 4px;
      letter-spacing: 0.02em;
    }

    .vp-status {
      display: inline-flex;
      align-items: center;
      gap: 4.5px;
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 500;
      color: var(--accent-green);
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 2px 7px;
      border-radius: 9999px;
      letter-spacing: 0.04em;
    }

    .vp-beacon {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent-green);
    }

    /* 2. Linear Interactive Command Section */
    .vp-section-label {
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 6px;
      padding-left: 2px;
    }

    .vp-action-stack {
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      box-shadow: var(--border-highlight), 0 4px 20px rgba(0, 0, 0, 0.4);
      margin-bottom: 12px;
      overflow: hidden;
    }

    .vp-action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 8.5px 11px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
      cursor: pointer;
      text-align: left;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .vp-action-row:last-child {
      border-bottom: none;
    }

    .vp-action-row:hover {
      background: var(--bg-card-hover);
    }

    .vp-action-row:hover .vp-action-icon {
      color: #ffffff;
      transform: scale(1.08);
    }

    .vp-action-row:hover .vp-action-title {
      color: #ffffff;
    }

    .vp-row-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .vp-action-icon {
      width: 15px;
      height: 15px;
      color: var(--text-secondary);
      flex-shrink: 0;
      transition: transform 0.15s ease, color 0.15s ease;
    }

    .vp-action-meta {
      display: flex;
      flex-direction: column;
      gap: 0.5px;
    }

    .vp-action-title {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: #e2e8f0;
      transition: color 0.15s ease;
    }

    .vp-action-sub {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: -0.005em;
    }

    /* 3. Apple Hardware Keycap Badges */
    .vp-kbd-group {
      display: inline-flex;
      align-items: center;
      gap: 2.5px;
    }

    kbd {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
      padding: 3px 5.5px;
      border-radius: 4px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.03) 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-bottom-color: rgba(255, 255, 255, 0.18);
      color: #cbd5e1;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    /* 4. Keyboard Shortcuts Matrix Card */
    .vp-matrix-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      box-shadow: var(--border-highlight);
      padding: 9px 11px;
      margin-bottom: 11px;
    }

    .vp-matrix-header {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .vp-matrix-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 5px 9px;
      align-items: center;
    }

    .vp-matrix-desc {
      font-size: 10.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 5. Minimalist Footer */
    .vp-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
      font-size: 10px;
      color: var(--text-muted);
    }

    .vp-footer a {
      color: var(--accent-cyan);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 10px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: color 0.15s;
    }

    .vp-footer a:hover {
      color: #7dd3fc;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="vp-nav">
    <div class="vp-brand">
      <div class="vp-icon-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="display: block;">
          <path d="M3 9V3H9" stroke="#0071E3" stroke-width="2.8" stroke-linecap="square"/>
          <path d="M21 15V21H15" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="square"/>
          <path d="M7 8L12 17L17 8" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="12" y1="9.5" x2="12" y2="12.5" stroke="#0071E3" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="10.5" y1="11" x2="13.5" y2="11" stroke="#0071E3" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="vp-title">
        VisualPatch
        <span class="vp-badge">v2.0</span>
      </div>
    </div>
    <div class="vp-status">
      <span class="vp-beacon"></span>
      <span>ACTIVE</span>
    </div>
  </header>

  <!-- Commands Stack -->
  <div class="vp-section-label">Quick Actions</div>
  <div class="vp-action-stack">
    <!-- Send to Agent -->
    <button class="vp-action-row" id="send-agent-btn" title="Send all annotations to AI agent inbox">
      <div class="vp-row-left">
        <svg class="vp-action-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="color: #38bdf8;">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
        </svg>
        <div class="vp-action-meta">
          <span class="vp-action-title">Send to Agent ⚡</span>
          <span class="vp-action-sub">Populate .visualpatch/inbox.md</span>
        </div>
      </div>
      <div class="vp-kbd-group">
        <kbd>Ctrl</kbd><kbd>↵</kbd>
      </div>
    </button>

    <!-- Area Screenshot -->
    <button class="vp-action-row" id="toggle-screenshot" title="Press S to capture screenshot">
      <div class="vp-row-left">
        <svg class="vp-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
          <circle cx="12" cy="13" r="4" />
        </svg>
        <div class="vp-action-meta">
          <span class="vp-action-title">Area Screenshot</span>
          <span class="vp-action-sub">Spotlight crop & dimension pill</span>
        </div>
      </div>
      <div class="vp-kbd-group">
        <kbd>S</kbd>
      </div>
    </button>

    <!-- Inspect & Pin -->
    <button class="vp-action-row" id="toggle-inspect" title="Hover & click element to annotate">
      <div class="vp-row-left">
        <svg class="vp-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <line x1="22" y1="12" x2="18" y2="12" />
          <line x1="6" y1="12" x2="2" y2="12" />
          <line x1="12" y1="6" x2="12" y2="2" />
          <line x1="12" y1="22" x2="12" y2="18" />
          <circle cx="12" cy="12" r="3" />
        </svg>
        <div class="vp-action-meta">
          <span class="vp-action-title">Inspect & Drop Pin</span>
          <span class="vp-action-sub">Live selector & text extraction</span>
        </div>
      </div>
      <div class="vp-kbd-group">
        <kbd>Esc</kbd>
      </div>
    </button>

    <!-- Floating Dock -->
    <button class="vp-action-row" id="toggle-toolbar" title="Toggle on-screen toolbar">
      <div class="vp-row-left">
        <svg class="vp-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
        <div class="vp-action-meta">
          <span class="vp-action-title">Floating Dock</span>
          <span class="vp-action-sub">Show / hide on-screen toolbar</span>
        </div>
      </div>
      <div class="vp-kbd-group">
        <kbd>Alt</kbd><kbd>T</kbd>
      </div>
    </button>
  </div>

  <!-- Keyboard Shortcuts Matrix -->
  <div class="vp-matrix-card">
    <div class="vp-matrix-header">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="20" height="16" x="2" y="4" rx="2" />
        <path d="M6 8h.001M10 8h.001M14 8h.001M18 8h.001M8 12h.001M12 12h.001M16 12h.001M7 16h10" />
      </svg>
      <span>Keyboard Shortcuts</span>
    </div>
    <div class="vp-matrix-grid">
      <div class="vp-kbd-group"><kbd>Ctrl</kbd><kbd>↵</kbd></div>
      <div class="vp-matrix-desc">Send to Agent ⚡ (.visualpatch)</div>

      <div class="vp-kbd-group"><kbd>S</kbd></div>
      <div class="vp-matrix-desc">Crop Area Screenshot</div>

      <div class="vp-kbd-group"><kbd>Ctrl</kbd><kbd>C</kbd></div>
      <div class="vp-matrix-desc">Copy for AI (+ image strip)</div>

      <div class="vp-kbd-group"><kbd>Esc</kbd></div>
      <div class="vp-matrix-desc">Toggle Inspect / Close Card</div>

      <div class="vp-kbd-group"><kbd>Alt</kbd><kbd>T</kbd></div>
      <div class="vp-matrix-desc">Minimize / Show Dock</div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="vp-footer">
    <span>100% Local • Zero Telemetry</span>
    <a href="https://github.com/OpusTechnica/VisualPatch" target="_blank" rel="noreferrer">
      GitHub
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 17 17 7M7 7h10v10" />
      </svg>
    </a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
